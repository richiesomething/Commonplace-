<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>Commonplace Stationery</title>
  <meta name="description" content="Commonplace Stationery, a neighborhood paper and pen shop.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="home">
    <h1 class="wordmark">
      <img src="assets/img/wordmark.webp" width="2000" height="667" alt="Commonplace Stationery">
    </h1>
    <p class="tagline">Friendly Neighborhood Stationery Shop</p>
    <img class="storefront" src="assets/img/storefront.webp" width="1536" height="1024"
         alt="Illustration of the Commonplace shop: a grey clapboard cottage with a red brick chimney, blue awnings over glass doors, and a white porch framed by shrubs.">

    <section class="hours" aria-labelledby="hours-title">
      <h2 id="hours-title">Store Hours</h2>
      <p class="open-status" id="open-status" hidden></p>
      <table class="hours-table">
        <tbody>
          <tr data-day="1"><th scope="row">Monday</th><td>10am – 6pm</td></tr>
          <tr data-day="2"><th scope="row">Tuesday</th><td>10am – 6pm</td></tr>
          <tr data-day="3"><th scope="row">Wednesday</th><td>10am – 6pm</td></tr>
          <tr data-day="4"><th scope="row">Thursday</th><td>10am – 8pm</td></tr>
          <tr data-day="5"><th scope="row">Friday</th><td>10am – 8pm</td></tr>
          <tr data-day="6"><th scope="row">Saturday</th><td>9am – 6pm</td></tr>
          <tr data-day="0"><th scope="row">Sunday</th><td>11am – 5pm</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <div class="gingham" aria-hidden="true"></div>
  <script src="js/hours.js"></script>
</body>
</html>
